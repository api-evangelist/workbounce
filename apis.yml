name: Workbounce
description: 'Workbounce was an AI-powered revenue and sales enablement platform that
  gave sales reps instant answers to deal-blocking questions by connecting company
  documents and knowledge to AI-powered search, delivered through a Slack bot and
  Chrome extension. Co-founded by Adam Smith and Rowan Bailey and backed by Index
  Ventures. As of July 2026 workbounce.com returns HTTP 402 (Vercel DEPLOYMENT_DISABLED)
  and the company appears defunct; no public API, developer docs, SDKs, or packages
  were ever published.'
